name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/prepare-neighborhood-boundaries-multi-source.py"
      - "tools/convert-multi-source-to-site-format.py"
      - "tests/**"
      - ".github/workflows/**"
      - "assets/map-app.js"
      - "assets/map-boot.js"
      - "assets/population-choropleth.mjs"
      - "assets/data-catalog.json"
      - "assets/neighborhood-boundaries-index.json"
      - "assets/neighborhood-boundaries/**"
      - "carte-interactive-maroc.html"
      - "sw.js"
  push:
    branches: [main]
    paths:
      - "tools/prepare-neighborhood-boundaries-multi-source.py"
      - "tools/convert-multi-source-to-site-format.py"
      - "tests/**"
      - ".github/workflows/**"
      - "assets/map-app.js"
      - "assets/map-boot.js"
      - "assets/population-choropleth.mjs"
      - "assets/data-catalog.json"
      - "assets/neighborhood-boundaries-index.json"
      - "assets/neighborhood-boundaries/**"
      - "carte-interactive-maroc.html"
      - "sw.js"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "shapely>=2.1" requests openpyxl
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check assets/population-choropleth.mjs
          node --input-type=module --check < assets/map-app.js
      - name: Run population choropleth tests
        run: node --test tests/test_population_choropleth.mjs
