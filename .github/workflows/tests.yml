name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/prepare-neighborhood-boundaries-multi-source.py"
      - "tools/convert-multi-source-to-site-format.py"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "tools/prepare-neighborhood-boundaries-multi-source.py"
      - "tools/convert-multi-source-to-site-format.py"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "shapely>=2.1" requests openpyxl
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
