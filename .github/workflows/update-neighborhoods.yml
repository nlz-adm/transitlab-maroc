name: Update Neighborhood Boundaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/prepare-neighborhood-boundaries-multi-source.py"
      - "tools/fetch-overture-neighborhood-areas.py"
      - "tools/extract-osm-neighborhood-polygons.py"
      - "tools/assign-mapped-neighborhood-polygons.py"
      - "tools/convert-multi-source-to-site-format.py"
      - "tools/build-urban-block-sectors.py"
      - "tools/build-estimated-neighborhood-zones.py"
      - "tools/build-postal-neighborhood-registry.py"
      - ".github/workflows/update-neighborhoods.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-neighborhood-boundaries
  cancel-in-progress: true

jobs:
  update-neighborhoods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OSM geometry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "shapely>=2.1" requests openpyxl pyarrow overturemaps

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build commune input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          regions = {
              "01": "Tanger-Tétouan-Al Hoceïma",
              "02": "Oriental",
              "03": "Fès-Meknès",
              "04": "Rabat-Salé-Kénitra",
              "05": "Béni Mellal-Khénifra",
              "06": "Casablanca-Settat",
              "07": "Marrakech-Safi",
              "08": "Drâa-Tafilalet",
              "09": "Souss-Massa",
              "10": "Guelmim-Oued Noun",
              "11": "Laâyoune-Sakia El Hamra",
              "12": "Dakhla-Oued Ed-Dahab",
          }
          features = []
          for code, name in regions.items():
              path = Path(f"assets/commune-boundaries/{code}.geojson")
              if not path.exists():
                  raise SystemExit(f"Fichier communal absent : {path}")
              data = json.loads(path.read_text(encoding="utf-8"))
              for feature in data.get("features", []):
                  props = feature.setdefault("properties", {})
                  props.setdefault("region", name)
                  props["region_code"] = code
                  features.append(feature)

          if len(features) < 1000:
              raise SystemExit(f"Entrée administrative incomplète : {len(features)} communes")
          target = Path("assets/data/division_area.geojson")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps({"type": "FeatureCollection", "features": features}, ensure_ascii=False),
              encoding="utf-8",
          )
          print(f"Entrée construite : {len(features)} communes")
          PY

      - name: Extract existing mapped neighbourhood polygons
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          index = json.loads(Path("assets/neighborhood-boundaries-index.json").read_text(encoding="utf-8"))
          seeds = []
          for region in index.get("regions", []):
              with gzip.open(Path(region["url"]), "rt", encoding="utf-8") as stream:
                  collection = json.load(stream)
              for feature in collection.get("features", []):
                  props = feature.get("properties") or {}
                  if props.get("boundaryKind") != "mapped":
                      continue
                  geometry = feature.get("geometry") or {}
                  if geometry.get("type") not in {"Polygon", "MultiPolygon"}:
                      continue
                  seeds.append({
                      "type": "Feature",
                      "properties": {
                          "name": props.get("name_fr") or props.get("name") or props.get("name_ar") or "",
                          "name_fr": props.get("name_fr") or props.get("name") or "",
                          "name_ar": props.get("name_ar") or "",
                          "population": props.get("population"),
                          "source": props.get("source") or "overture",
                          "estimated": False,
                      },
                      "geometry": geometry,
                  })

          if len(seeds) < 30:
              raise SystemExit(f"Seulement {len(seeds)} contours cartographiés historiques restaurables.")
          target = Path("assets/data/mapped-neighborhood-seeds.geojson")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps({"type": "FeatureCollection", "features": seeds}, ensure_ascii=False),
              encoding="utf-8",
          )
          print(f"{len(seeds)} contours cartographiés historiques conservés comme seeds.")
          PY

      - name: Fetch mapped Overture neighbourhood polygons
        run: |
          python tools/fetch-overture-neighborhood-areas.py \
            --communes assets/data/division_area.geojson \
            --existing assets/data/mapped-neighborhood-seeds.geojson \
            --output assets/data/mapped-neighborhood-seeds-combined.geojson \
            --report reports/overture-neighborhood-coverage.md \
            --min-total 30

      - name: Assign mapped neighbourhood polygons to communes
        run: |
          python tools/assign-mapped-neighborhood-polygons.py \
            --communes assets/data/division_area.geojson \
            --mapped-seeds assets/data/mapped-neighborhood-seeds-combined.geojson \
            --output assets/data/neighborhoods-estimated.geojson \
            --report reports/mapped-neighborhood-coverage.md \
            --min-polygons 30

      - name: Validate source-mapped polygons before sector generation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path("assets/data/neighborhoods-estimated.geojson").read_text(encoding="utf-8"))
          features = generated.get("features", [])
          mapped = [
              feature for feature in features
              if (feature.get("properties") or {}).get("boundaryKind") == "mapped"
              and (feature.get("properties") or {}).get("estimated") is False
          ]
          communes = {
              str((feature.get("properties") or {}).get("commune_id"))
              for feature in mapped if (feature.get("properties") or {}).get("commune_id")
          }
          regions = {
              str((feature.get("properties") or {}).get("region_code"))
              for feature in mapped if (feature.get("properties") or {}).get("region_code")
          }
          if len(mapped) < 30:
              raise SystemExit(f"Seulement {len(mapped)} vrais contours cartographiés ; 30 minimum.")
          if len(communes) < 20 or len(regions) < 4:
              raise SystemExit(f"Couverture cartographiée insuffisante : {len(communes)} communes, {len(regions)} régions.")
          if len(mapped) != len(features):
              raise SystemExit("L'entrée contient des cellules estimées ; elles ne doivent pas alimenter la couche de contours.")
          if any((feature.get("geometry") or {}).get("type") not in {"Polygon", "MultiPolygon"} for feature in mapped):
              raise SystemExit("Au moins un contour source n'est pas un polygone.")
          if any(not (feature.get("properties") or {}).get("name") for feature in mapped):
              raise SystemExit("Au moins un contour cartographié n'a pas de nom.")
          print(f"Contours cartographiés validés : {len(mapped)}, {len(communes)} communes, {len(regions)} régions. Aucune cellule estimative.")
          PY

      - name: Download current Morocco OSM extract and export road/building geometry
        timeout-minutes: 45
        run: |
          set -euo pipefail
          PBF_URL="https://download.geofabrik.de/africa/morocco-latest.osm.pbf"
          EFFECTIVE_PBF_URL="$(curl -fL --retry 3 --retry-delay 5 -o /tmp/morocco-latest.osm.pbf -w '%{url_effective}' "$PBF_URL")"
          echo "Resolved OSM snapshot: $EFFECTIVE_PBF_URL"
          curl -fL --retry 3 --retry-delay 3 "$EFFECTIVE_PBF_URL.md5" -o /tmp/morocco-latest.osm.pbf.md5
          EXPECTED="$(awk '{print $1}' /tmp/morocco-latest.osm.pbf.md5 | head -n 1)"
          test -n "$EXPECTED"
          echo "$EXPECTED  /tmp/morocco-latest.osm.pbf" | md5sum -c -

          osmium tags-filter /tmp/morocco-latest.osm.pbf \
            w/highway=primary w/highway=secondary w/highway=tertiary \
            w/highway=unclassified w/highway=residential w/highway=living_street \
            w/highway=service w/highway=pedestrian w/highway=road \
            -o /tmp/morocco-roads.osm.pbf
          osmium export /tmp/morocco-roads.osm.pbf \
            -f geojsonseq --geometry-types=linestring -o /tmp/morocco-roads.geojsonseq

          osmium tags-filter /tmp/morocco-latest.osm.pbf w/building \
            -o /tmp/morocco-buildings.osm.pbf
          osmium export /tmp/morocco-buildings.osm.pbf \
            -f geojsonseq --geometry-types=polygon -o /tmp/morocco-buildings.geojsonseq

          osmium tags-filter /tmp/morocco-latest.osm.pbf \
            n/place=quarter n/place=suburb n/place=neighbourhood n/place=locality \
            w/place=quarter w/place=suburb w/place=neighbourhood w/place=locality \
            r/place=quarter r/place=suburb r/place=neighbourhood r/place=locality \
            n/boundary=place w/boundary=place r/boundary=place \
            -o /tmp/morocco-neighborhoods.osm.pbf
          osmium export /tmp/morocco-neighborhoods.osm.pbf \
            -f geojsonseq --geometry-types=point,linestring,polygon -o /tmp/morocco-neighborhoods.geojsonseq

          ls -lh /tmp/morocco-roads.geojsonseq /tmp/morocco-buildings.geojsonseq /tmp/morocco-neighborhoods.geojsonseq
          rm -f /tmp/morocco-latest.osm.pbf /tmp/morocco-latest.osm.pbf.md5 \
            /tmp/morocco-roads.osm.pbf /tmp/morocco-buildings.osm.pbf /tmp/morocco-neighborhoods.osm.pbf

      - name: Enrich mapped neighbourhoods with real OSM area boundaries
        run: |
          python tools/extract-osm-neighborhood-polygons.py \
            --existing assets/data/neighborhoods-estimated.geojson \
            --osm-geojsonseq /tmp/morocco-neighborhoods.geojsonseq \
            --output assets/data/neighborhoods-osm-candidates.geojson \
            --report reports/osm-neighborhood-polygons.md

          python tools/assign-mapped-neighborhood-polygons.py \
            --communes assets/data/division_area.geojson \
            --mapped-seeds assets/data/neighborhoods-osm-candidates.geojson \
            --output assets/data/neighborhoods-estimated.geojson \
            --report reports/mapped-neighborhood-coverage.md \
            --min-polygons 30

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("assets/data/neighborhoods-estimated.geojson").read_text(encoding="utf-8"))
          features = data.get("features", [])
          mapped = [
              f for f in features
              if (f.get("properties") or {}).get("boundaryKind") == "mapped"
              and (f.get("properties") or {}).get("estimated") is False
          ]
          communes = {
              str((f.get("properties") or {}).get("commune_id"))
              for f in mapped if (f.get("properties") or {}).get("commune_id")
          }
          regions = {
              str((f.get("properties") or {}).get("region_code"))
              for f in mapped if (f.get("properties") or {}).get("region_code")
          }
          if len(mapped) < 30 or len(mapped) != len(features):
              raise SystemExit(f"Invalid mapped-only layer after OSM enrichment: {len(mapped)} mapped of {len(features)}.")
          if any((f.get("geometry") or {}).get("type") not in {"Polygon", "MultiPolygon"} for f in mapped):
              raise SystemExit("OSM enrichment emitted a non-polygon feature.")
          if any(not (f.get("properties") or {}).get("name") for f in mapped):
              raise SystemExit("OSM enrichment emitted an unnamed feature.")
          if len(communes) < 20 or len(regions) < 4:
              raise SystemExit(f"Mapped coverage unexpectedly low: {len(communes)} communes, {len(regions)} regions.")
          print(f"Mapped neighbourhood contours after OSM enrichment: {len(mapped)}; {len(communes)} communes; {len(regions)} regions.")
          PY

      - name: Build at least 10000 road-bounded urban sectors
        timeout-minutes: 45
        run: |
          python tools/build-urban-block-sectors.py \
            --communes assets/data/division_area.geojson \
            --roads /tmp/morocco-roads.geojsonseq \
            --buildings /tmp/morocco-buildings.geojsonseq \
            --output assets/data/urban-block-sectors.geojson \
            --report reports/urban-block-coverage.md \
            --target-min 10000 \
            --target-max 10000 \
            --all-output assets/data/urban-block-candidates.geojson

      - name: Build 10000 estimated neighbourhood-scale zones
        timeout-minutes: 25
        run: |
          python tools/build-estimated-neighborhood-zones.py \
            --blocks assets/data/urban-block-candidates.geojson \
            --mapped-boundaries assets/data/neighborhoods-estimated.geojson \
            --osm-geojsonseq /tmp/morocco-neighborhoods.geojsonseq \
            --output assets/data/estimated-neighborhood-zones.geojson \
            --report reports/estimated-neighborhood-zones.md \
            --target 10000 \
            --max-area-km2 1.2

      - name: Fetch Poste Maroc neighborhood catalogue and match mapped OSM geometry
        timeout-minutes: 15
        run: |
          set -euo pipefail
          POSTAL_URL="https://data.gov.ma/data/dataset/e0093dbf-38f0-440a-91da-ad3f0243f378/resource/7f257007-d512-4a2e-9f7f-ba29ee4ac8b1/download/codes-postaux-quartiers-2018.xlsx"
          POSTAL_MIRROR_URL="http://datagovma.webhi.net/data/ar/dataset/e0093dbf-38f0-440a-91da-ad3f0243f378/resource/7f257007-d512-4a2e-9f7f-ba29ee4ac8b1/download/codes-postaux-quartiers-2018.xlsx"
          POSTAL_HF_BASE="https://huggingface.co/datasets/electricsheepafrica/africa-morocco-codes-postaux-des-quartiers-1d96cfdb/resolve/main"
          POSTAL_FILE=""

          # The official data.gov.ma host sometimes resets connections. Retry all
          # network errors, then fall back to the archived mirror and a Parquet
          # mirror of the same 10,026-row Poste Maroc source.
          if curl -fLsS --connect-timeout 20 --max-time 180 --retry 4 --retry-all-errors --retry-delay 3 \
              "$POSTAL_URL" -o /tmp/postal-neighborhoods.xlsx; then
            if test "$(stat -c%s /tmp/postal-neighborhoods.xlsx)" -gt 100000; then
              POSTAL_FILE="/tmp/postal-neighborhoods.xlsx"
              echo "Poste Maroc source downloaded from data.gov.ma."
            fi
          fi

          if [ -z "$POSTAL_FILE" ]; then
            echo "Primary postal source unavailable; trying archive mirror."
            if curl -fLsS --connect-timeout 20 --max-time 180 --retry 2 --retry-all-errors --retry-delay 2 \
                "$POSTAL_MIRROR_URL" -o /tmp/postal-neighborhoods-mirror.xlsx; then
              if test "$(stat -c%s /tmp/postal-neighborhoods-mirror.xlsx)" -gt 100000; then
                POSTAL_FILE="/tmp/postal-neighborhoods-mirror.xlsx"
                echo "Poste Maroc source downloaded from the archived mirror."
              fi
            fi
          fi

          if [ -z "$POSTAL_FILE" ]; then
            echo "Spreadsheet mirrors unavailable; trying the reproducible Parquet mirror."
            for PARQUET_PATH in "data/train-00000-of-00001.parquet" "train-00000-of-00001.parquet"; do
              if curl -fLsS --connect-timeout 20 --max-time 240 --retry 3 --retry-all-errors --retry-delay 2 \
                  "$POSTAL_HF_BASE/$PARQUET_PATH?download=true" -o /tmp/postal-neighborhoods.parquet; then
                if test "$(stat -c%s /tmp/postal-neighborhoods.parquet)" -gt 10000; then
                  POSTAL_FILE="/tmp/postal-neighborhoods.parquet"
                  echo "Poste Maroc Parquet mirror downloaded from Hugging Face ($PARQUET_PATH)."
                  break
                fi
              fi
            done
          fi

          if [ -z "$POSTAL_FILE" ]; then
            echo "::error::Could not retrieve the 10,026-row Poste Maroc neighborhood catalogue from any configured source."
            exit 1
          fi

          python tools/build-postal-neighborhood-registry.py \
            --postal-data "$POSTAL_FILE" \
            --osm-geojsonseq /tmp/morocco-neighborhoods.geojsonseq \
            --communes assets/data/division_area.geojson \
            --include-unmatched-osm \
            --output assets/neighborhood-directory/postal-neighborhoods.geojson.gz \
            --index assets/neighborhood-directory-index.json \
            --report reports/postal-neighborhood-coverage.md

      - name: Convert validated data to site format
        run: |
          python tools/convert-multi-source-to-site-format.py \
            --input assets/data/neighborhoods-estimated.geojson \
            --output-dir assets/neighborhood-boundaries \
            --index assets/neighborhood-boundaries-index.json \
            --mapped-only \
            --urban-blocks assets/data/urban-block-sectors.geojson \
            --estimated-neighborhoods assets/data/estimated-neighborhood-zones.geojson \
            --expected-estimated-neighborhoods 10000

      - name: Synchronize data catalog, index version and cache version
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path

          index_path = Path("assets/neighborhood-boundaries-index.json")
          catalog_path = Path("assets/data-catalog.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          features = int(index.get("features", 0))
          regions = index.get("regions", [])
          if features <= 0 or not regions:
              raise SystemExit("Index cartographique vide ; version publiée conservée.")

          app_path = Path("assets/map-app.js")
          app = app_path.read_text(encoding="utf-8")
          app, count = re.subn(
              r"NEIGHBORHOOD_BOUNDARY_VERSION='[^']+'",
              "NEIGHBORHOOD_BOUNDARY_VERSION='" + str(index["version"]) + "'",
              app, count=1
          )
          if count != 1:
              raise SystemExit("Impossible de synchroniser la version de l'index dans map-app.js.")

          cache_version = "maroc-v31-" + time.strftime("%Y%m%d", time.gmtime())
          app = re.sub(r"maroc-v\d+-\d{8}", cache_version, app)
          app_path.write_text(app, encoding="utf-8")

          boot_path = Path("assets/map-boot.js")
          boot = re.sub(r"maroc-v\d+-\d{8}", cache_version,
                        boot_path.read_text(encoding="utf-8"))
          boot_path.write_text(boot, encoding="utf-8")

          html_path = Path("carte-interactive-maroc.html")
          html = re.sub(r"maroc-v\d+-\d{8}", cache_version,
                        html_path.read_text(encoding="utf-8"))
          html_path.write_text(html, encoding="utf-8")

          sw_path = Path("sw.js")
          sw = re.sub(r"transitlab-maroc-v\d+-\d{8}", "transitlab-" + cache_version,
                      sw_path.read_text(encoding="utf-8"))
          sw_path.write_text(sw, encoding="utf-8")

          layer = catalog.setdefault("layers", {}).setdefault("neighborhoodBoundaries", {})
          layer.update({
              "url": "assets/neighborhood-boundaries-index.json",
              "features": features,
              "mappedFeatures": int(index.get("mappedFeatures", 0)),
              "estimatedFeatures": int(index.get("estimatedFeatures", 0)),
              "urbanBlockFeatures": int(index.get("urbanBlockFeatures", 0)),
              "communesWithFeatures": int(index.get("communesWithFeatures", 0)),
              "regions": len(regions),
              "bytesCompressed": sum(int(region.get("bytesCompressed", 0)) for region in regions),
              "loading": "Quartiers cartographiés et îlots urbains estimés à partir du réseau routier et des empreintes de bâtiments OSM, visibles au zoom 11+.",
              "method": f"{int(index.get('mappedFeatures', 0))} contours cartographiés + {int(index.get('urbanBlockFeatures', 0))} îlots urbains estimés.",
              "license": " ; ".join(index.get("licenses", ["ODbL 1.0"])),
              "limitation": "Les îlots urbains suivent les rues et les empreintes bâties, mais ne sont pas des quartiers officiels. Les zones où OSM est incomplet peuvent rester sans secteur.",
          })
          directory_index_path = Path("assets/neighborhood-directory-index.json")
          directory_index = json.loads(directory_index_path.read_text(encoding="utf-8"))
          app, directory_version_count = re.subn(
              r"NEIGHBORHOOD_DIRECTORY_VERSION='[^']+'",
              "NEIGHBORHOOD_DIRECTORY_VERSION='" + str(directory_index["version"]) + "'",
              app, count=1
          )
          if directory_version_count != 1:
              raise SystemExit("Impossible de synchroniser la version du répertoire de quartiers dans map-app.js.")
          app_path.write_text(app, encoding="utf-8")
          directory_layer = catalog.setdefault("layers", {}).setdefault("postalNeighborhoodDirectory", {})
          directory_layer.update({
              "url": "assets/neighborhood-directory-index.json",
              "features": int(directory_index.get("features", 0)),
              "postalFeatures": int(directory_index.get("postalFeatures", 0)),
              "osmSupplementFeatures": int(directory_index.get("osmSupplementFeatures", 0)),
              "mappedBoundaryFeatures": int(directory_index.get("mappedBoundaryFeatures", 0)),
              "mappedPointFeatures": int(directory_index.get("mappedPointFeatures", 0)),
              "unlocatedFeatures": int(directory_index.get("unlocatedFeatures", 0)),
              "bytesCompressed": int(directory_index.get("bytesCompressed", 0)),
              "source": "Barid Al Maghrib 2018 + OpenStreetMap",
              "sourceDate": "Poste Maroc 2018-09 ; OSM au moment du rafraîchissement",
              "license": "ODbL 1.0",
              "loading": "Répertoire consultable des quartiers postaux et des entités OSM nommées qui ne figurent pas au catalogue postal.",
              "method": "Correspondance stricte des lignes postales et de leurs géométries, puis ajout séparé des noms et géométries OSM supplémentaires. Les frontières restent des polygones cartographiés ; les points ne sont pas des contours.",
              "limitation": "Poste Maroc ne fournit pas de contours. Les entrées OSM supplémentaires sont des entités cartographiées, pas des limites administratives officielles. Les entrées non localisées restent sans géométrie ; aucune limite n'est inventée.",
          })

          catalog["version"] = cache_version
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Catalogue synchronisé : {features} secteurs, dont {index.get('mappedFeatures', 0)} contours cartographiés et {index.get('urbanBlockFeatures', 0)} îlots estimés ; {len(regions)} régions, version {cache_version}.")
          print(f"Index de géométries : {index['version']}")
          PY

      - name: Validate converted index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("assets/neighborhood-boundaries-index.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("assets/data-catalog.json").read_text(encoding="utf-8"))
          regions = index.get("regions", [])
          total = sum(int(region.get("count", 0)) for region in regions)
          mapped = int(index.get("mappedFeatures", 0))
          urban_blocks = int(index.get("urbanBlockFeatures", 0))
          if index.get("features", 0) < 10000 or total != index.get("features"):
              raise SystemExit("Le jeu doit contenir au moins 10000 secteurs cohérents ; publication refusée.")
          if index.get("estimatedFeatures", 0) != 0 or mapped + urban_blocks != index["features"]:
              raise SystemExit("Le jeu contient des Voronoï ou des estimations non qualifiées ; publication refusée.")
          if urban_blocks < 10000:
              raise SystemExit(f"Seulement {urban_blocks} îlots urbains estimés ; 10000 requis.")
          if len(regions) < 4:
              raise SystemExit(f"Couverture géographique trop faible : {len(regions)} régions.")
          if catalog["layers"]["neighborhoodBoundaries"].get("urbanBlockFeatures", 0) != urban_blocks:
              raise SystemExit("Le catalogue et l'index ne décrivent pas les mêmes îlots urbains.")
          if catalog["layers"]["neighborhoodBoundaries"]["features"] != index["features"]:
              raise SystemExit("Catalogue et index ne correspondent pas.")
          app = Path("assets/map-app.js").read_text(encoding="utf-8")
          if f"NEIGHBORHOOD_BOUNDARY_VERSION='{index['version']}'" not in app:
              raise SystemExit("Version de l'index et version de chargement différentes.")
          print(f"Index cohérent : {index['features']} vrais contours, {index.get('communesWithFeatures', 0)} communes, {len(regions)} régions.")
          PY

      - name: Validate postal neighborhood directory
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          index = json.loads(Path("assets/neighborhood-directory-index.json").read_text(encoding="utf-8"))
          data_path = Path("assets/neighborhood-directory/postal-neighborhoods.geojson.gz")
          with gzip.open(data_path, "rt", encoding="utf-8") as stream:
              collection = json.load(stream)
          features = collection.get("features", [])
          if index.get("postalFeatures", 0) < 10000 or len(features) != index.get("features"):
              raise SystemExit(f"Répertoire incomplet : {len(features)} enregistrements dont {index.get('postalFeatures', 0)} postaux.")
          counts = {"mapped_boundary": 0, "mapped_point": 0, "unlocated": 0}
          for feature in features:
              props = feature.get("properties") or {}
              status = props.get("geometryStatus")
              if status not in counts:
                  raise SystemExit(f"Statut de géométrie inconnu : {status}")
              counts[status] += 1
              geometry = feature.get("geometry")
              if status == "mapped_boundary" and (not geometry or geometry.get("type") not in {"Polygon", "MultiPolygon"}):
                  raise SystemExit("Une frontière cartographiée n'est pas polygonale.")
              if status == "mapped_point" and (not geometry or geometry.get("type") != "Point"):
                  raise SystemExit("Une localisation ponctuelle doit rester un point.")
              if status == "unlocated" and geometry is not None:
                  raise SystemExit("Une entrée non localisée ne doit pas recevoir de géométrie inventée.")
          postal_count = sum(1 for feature in features if (feature.get("properties") or {}).get("source") == "poste_maroc_2018")
          osm_count = sum(1 for feature in features if (feature.get("properties") or {}).get("source") == "openstreetmap")
          if postal_count != index.get("postalFeatures") or osm_count != index.get("osmSupplementFeatures"):
              raise SystemExit("Les compteurs par source ne correspondent pas aux données.")
          expected = {
              "mappedBoundaryFeatures": counts["mapped_boundary"],
              "mappedPointFeatures": counts["mapped_point"],
              "unlocatedFeatures": counts["unlocated"],
          }
          if any(int(index.get(key, -1)) != value for key, value in expected.items()):
              raise SystemExit("Les compteurs du répertoire ne correspondent pas aux données.")
          print(f"Répertoire validé : {len(features)} entrées dont {postal_count} postales + {osm_count} OSM supplémentaires ; {counts['mapped_boundary']} contours, {counts['mapped_point']} points, {counts['unlocated']} sans géométrie.")
          PY

      - name: Propose the validated data for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/neighborhood-boundaries/ assets/neighborhood-boundaries-index.json assets/neighborhood-directory/ assets/neighborhood-directory-index.json assets/data-catalog.json assets/map-app.js assets/map-boot.js carte-interactive-maroc.html sw.js reports/
          if git diff --cached --quiet; then
            echo "Aucune différence : aucune pull request nécessaire."
            exit 0
          fi

          BRANCH="data/neighborhoods-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: actualiser les limites de quartiers multi-sources"
          git push --set-upstream origin "$BRANCH"

          cat > "$RUNNER_TEMP/neighborhood-pr-body.md" <<'EOF'
          ## Résumé

          - Pipeline multi-sources exécuté avec les tests de régression.
          - La sortie a passé les contrôles de volume, géométrie et couverture.
          - Le catalogue est synchronisé avec l'index régional.

          **À vérifier avant fusion :** comparer reports/neighborhood-coverage.md et inspecter visuellement au moins Casablanca, Rabat, Marrakech, Fès, Tanger, Agadir, Oujda, Laâyoune, Béni Mellal et Errachidia. Les secteurs estimatifs ne sont pas des limites officielles.
          EOF

          echo "Données validées poussées sur la branche $BRANCH."
          echo "Proposition à ouvrir : https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
