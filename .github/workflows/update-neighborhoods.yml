name: Update Neighborhood Boundaries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
  push:
    paths:
      - 'tools/prepare-neighborhood-boundaries-multi-source.py'
      - 'tools/convert-multi-source-to-site-format.py'
      - '.github/workflows/update-neighborhoods.yml'
    branches:
      - main

jobs:
  update-neighborhoods:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "shapely>=2.1" requests openpyxl

    - name: Build communes input from regional files
      run: |
        mkdir -p assets/data reports
        python - <<'PY'
        import json
        from pathlib import Path
        REGIONS = {
            "01": "Tanger-Tétouan-Al Hoceïma",
            "02": "Oriental",
            "03": "Fès-Meknès",
            "04": "Rabat-Salé-Kénitra",
            "05": "Béni Mellal-Khénifra",
            "06": "Casablanca-Settat",
            "07": "Marrakech-Safi",
            "08": "Drâa-Tafilalet",
            "09": "Souss-Massa",
            "10": "Guelmim-Oued Noun",
            "11": "Laâyoune-Sakia El Hamra",
            "12": "Dakhla-Oued Ed-Dahab",
        }
        features = []
        for code, name in REGIONS.items():
            path = Path(f"assets/commune-boundaries/{code}.geojson")
            if not path.exists():
                continue
            data = json.loads(path.read_text(encoding="utf-8"))
            for f in data.get("features", []):
                props = f.setdefault("properties", {})
                props.setdefault("region", name)
                props["region_code"] = code
                features.append(f)
        out = {"type": "FeatureCollection", "features": features}
        Path("assets/data/division_area.geojson").write_text(
            json.dumps(out, ensure_ascii=False), encoding="utf-8")
        print(f"-> {len(features)} communes fusionnees")
        PY

    - name: Run multi-source pipeline
      run: |
        python tools/prepare-neighborhood-boundaries-multi-source.py \
          --areas assets/data/division_area.geojson \
          --output assets/data/neighborhoods-estimated.geojson \
          --report reports/neighborhood-coverage.md
      env:
        TRANSITLAB_CACHE: ~/.cache/transitlab-maroc

    - name: Convert to site format
      run: |
        python tools/convert-multi-source-to-site-format.py \
          --input assets/data/neighborhoods-estimated.geojson \
          --output-dir assets/neighborhood-boundaries \
          --index assets/neighborhood-boundaries-index.json

    - name: Check for changes
      id: git-check
      run: |
        git add assets/neighborhood-boundaries/ assets/neighborhood-boundaries-index.json reports/
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "chore(data): mise à jour automatique des limites de quartiers (multi-source)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: No changes detected
      if: steps.git-check.outputs.changes == 'false'
      run: echo "Aucun changement détecté, pas de commit nécessaire."
